<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>My Bookings</h2>
    <button class="btn btn-outline-secondary" (click)="logout()">Logout</button>
  </div>

  <table *ngIf="bookings.length" class="table">
    <thead>
      <tr>
        <th>Plane Name</th>
        <th>Source</th>
        <th>Destination</th>
        <th>Price</th>
        <th>Start</th>
        <th>Arrival</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let b of bookings">
        <td>{{ b.planeName }}</td>
        <td>{{ b.source }}</td>
        <td>{{ b.destination }}</td>
        <td>{{ b.price }}</td>
        <td>{{ b.startTime }}</td>
        <td>{{ b.arrivalTime }}</td>
        <td>
          <button class="btn btn-danger btn-sm" (click)="cancelBooking(b.id)">Cancel</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!bookings.length" class="alert alert-info">No bookings found</div>
</div>
