<div class="d-flex align-items-center justify-content-center vh-100">
  <div class="card shadow-lg border-0 rounded-4" style="max-width: 500px; width: 100%;">
    <div class="card-body p-4">
      <h3 class="card-title text-center mb-4 fw-bold text-primary">Create Your Account</h3>
      <p class="text-center text-muted mb-4">Join us today! Fill in your details to sign up.</p>

      <form (ngSubmit)="onSubmit()" #signupForm="ngForm">
        <!-- Name -->
        <div class="mb-3">
          <label class="form-label fw-semibold">Full Name</label>
          <input type="text" [(ngModel)]="formData.name" name="name" class="form-control" placeholder="Enter your full name" required>
        </div>

        <!-- Address -->
        <div class="mb-3">
          <label class="form-label fw-semibold">Address</label>
          <input type="text" [(ngModel)]="formData.address" name="address" class="form-control" placeholder="Enter your address" required>
        </div>

        <!-- Username -->
        <div class="mb-3">
          <label class="form-label fw-semibold">Username</label>
          <input type="text" [(ngModel)]="formData.username" name="username" class="form-control" placeholder="Choose a username" required>
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" [(ngModel)]="formData.password" name="password" class="form-control" placeholder="Enter a password" required>
        </div>

        <!-- Confirm Password -->
        <div class="mb-3">
          <label class="form-label fw-semibold">Confirm Password</label>
          <input type="password" [(ngModel)]="formData.confirmPassword" name="confirmPassword" class="form-control" placeholder="Confirm your password" required>
        </div>

        <!-- Error Message -->
        <div *ngIf="error" class="alert alert-danger py-2">{{ error }}</div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary w-100 fw-semibold py-2" [disabled]="signupForm.invalid">
          Sign Up
        </button>



        <!-- Extra Links -->
        <div class="text-center mt-3">
          <small class="text-muted">Already have an account? <a href="/signin" class="text-primary text-decoration-none fw-semibold">Sign In</a></small>
        </div>
      </form>
    </div>
  </div>
</div>
